# gpmerge - per-controller remapping profiles
#
# Apply changes without unplugging anything:
#     su -c 'pkill -HUP gpmerge'
# Check the result:
#     tail /data/local/tmp/gpmerge.log
#
# Sections are matched as a glob against the controller name. List the names of
# the pads currently merged with:
#     su -c 'grep -B4 Handlers /proc/bus/input/devices | grep Name'
# The first matching section wins, so put specific names before wildcards.
#
# Directives:
#     preset nintendo | xbox     face-button layout shorthand
#     button <FROM> = <TO>       remap a button, or "= none" to drop it
#     axis   <FROM> = <TO>       remap an axis, or "= none" to drop it
#     invert <AXIS>              flip an axis direction
#     deadzone <AXIS> = <n>      ignore movement within n units of centre
#
# Button names: BTN_A/BTN_SOUTH, BTN_B/BTN_EAST, BTN_X/BTN_NORTH, BTN_Y/BTN_WEST,
#   BTN_TL, BTN_TR, BTN_TL2, BTN_TR2, BTN_SELECT, BTN_START, BTN_MODE,
#   BTN_THUMBL, BTN_THUMBR, BTN_DPAD_UP/DOWN/LEFT/RIGHT
# Axis names: ABS_X, ABS_Y (left stick), ABS_RX, ABS_RY (right stick),
#   ABS_Z, ABS_RZ (triggers), ABS_BRAKE, ABS_GAS, ABS_HAT0X, ABS_HAT0Y (d-pad)
# Stick range is -32768..32767 and triggers 0..1023, so a 8% stick deadzone
# is roughly 2600.

# The built-in pad is the reference layout: left untouched.
[Odin Controller]
preset xbox

# A Switch Pro *may* report its face buttons in Nintendo positions, so that what
# sits where Xbox puts A is reported as B. The AYN mapper already normalises
# some pads, so this starts neutral: if A and B (and X/Y) feel swapped compared
# with the built-in pad, change this to "preset nintendo" and run
# "su -c 'pkill -HUP gpmerge'".
[Nintendo Switch Pro Controller]
preset xbox

# Example — uncomment and adapt for any other pad:
# [8BitDo*]
# preset nintendo
# deadzone ABS_X = 2600
# deadzone ABS_Y = 2600
